<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spectrum — GTM Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,600&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#D95B28; --green:#3A7A65; --ink:#111111; --slate:#334155;
    --gold:#B8860B; --teal:#2F7D8A; --gray:#6B7280; --line:#DDDFE3;
    --bg:#F5F5F7; --panel:#FFFFFF;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:'Geist',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
  header{padding:15px 26px 12px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:relative;z-index:4}
  header .brand{display:flex;flex-direction:column;gap:3px}
  header .eyebrow{font-family:'Geist Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);display:flex;align-items:center;gap:7px}
  header .eyebrow::before{content:"";width:8px;height:8px;background:var(--orange);display:inline-block}
  header h1{font-family:'Lora',serif;font-size:21px;margin:0;font-weight:600;color:var(--ink);letter-spacing:-.01em}
  header h1 em{font-style:italic;color:var(--orange);font-weight:600}
  .controls{margin-left:auto;display:flex;gap:7px;align-items:center}
  .btn{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.03em;text-transform:uppercase;padding:7px 12px;border:1px solid var(--line);background:var(--panel);color:var(--slate);cursor:pointer;transition:all .12s}
  .btn:hover{background:#FBF4F0;border-color:var(--orange);color:var(--orange)}
  .legend{display:flex;gap:18px;flex-wrap:wrap;padding:9px 26px;border-bottom:1px solid var(--line);background:var(--panel);position:relative;z-index:4}
  .legend span{font-family:'Geist Mono',monospace;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--gray);display:flex;align-items:center;gap:7px}
  .dot{width:9px;height:9px;display:inline-block}
  #canvas{position:absolute;inset:0;top:0;cursor:grab;background:var(--bg)}
  #canvas.dragging{cursor:grabbing}
  #stage{position:absolute;left:0;top:0;transform-origin:0 0}
  svg.links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
  .node{position:absolute;width:250px;padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-left-width:3px;cursor:pointer;user-select:none;transition:border-color .12s,background .12s}
  .node:hover{background:#FBFAF9;border-color:var(--orange)}
  .node .name{font-size:12.5px;font-weight:500;line-height:1.3;color:var(--ink)}
  .node .note{font-family:'Geist Mono',monospace;font-size:9.5px;letter-spacing:.02em;color:var(--gray);margin-top:3px;line-height:1.3}
  .node.root{background:var(--ink);border-color:var(--ink);color:#fff;width:210px;text-align:center}
  .node.root .name{font-family:'Lora',serif;font-size:14px;color:#fff;font-weight:600}
  .node.region .name{font-size:13px;font-family:'Lora',serif;font-weight:600;letter-spacing:-.01em}
  .badge{position:absolute;right:-11px;top:50%;transform:translateY(-50%);background:var(--panel);border:1px solid var(--line);color:var(--gray);font-family:'Geist Mono',monospace;font-size:9.5px;padding:2px 6px;font-weight:600}
  .hint{position:absolute;bottom:13px;left:26px;font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.03em;color:#B7B2AC}
  #topbar{position:fixed;top:0;left:0;right:0;z-index:10;background:var(--panel)}
  #bowtie{position:relative;z-index:3;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 26px 8px;user-select:none;-webkit-user-select:none}
  #bowtie svg{max-width:1000px;display:block;margin:0 auto}
</style>
</head>
<body>
<div id="topbar">
<header>
  <div class="brand">
    <span class="eyebrow">FlytBase · Spectrum Pod</span>
    <h1>The GTM <em>Engine</em></h1>
  </div>
  <div class="controls">
    <button class="btn" id="expandAll">Expand all</button>
    <button class="btn" id="collapse">Collapse</button>
    <button class="btn" id="reset">Reset</button>
  </div>
</header>
<div class="legend" id="legend"></div>
<div id="bowtie">
  <svg viewBox="0 0 1100 300" preserveAspectRatio="xMidYMid meet" width="100%" height="212">
    <defs>
      <linearGradient id="gL" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#F0A574"/><stop offset="1" stop-color="#D95B28"/>
      </linearGradient>
      <linearGradient id="gR" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#3A7A65"/><stop offset="1" stop-color="#A6D0C2"/>
      </linearGradient>
      <path id="pLtop" d="M60,43 L452,81" fill="none"/>
      <path id="pLbot" d="M60,277 L452,239" fill="none"/>
      <path id="pRtop" d="M648,81 L1040,43" fill="none"/>
      <path id="pRbot" d="M648,239 L1040,277" fill="none"/>
    </defs>

    <!-- wrapper captions -->
    <text x="550" y="15" text-anchor="middle" font-family="Geist Mono,monospace" font-size="10.5" letter-spacing="1.5" fill="#334155">PARTNERS · THE PARALLEL MACHINE</text>
    <text x="550" y="296" text-anchor="middle" font-family="Geist Mono,monospace" font-size="10.5" letter-spacing="1.5" fill="#2F7D8A">THE BETS · MINING &amp; PORTS</text>

    <!-- LEFT funnel: wide outer-left, narrowing to knot -->
    <polygon points="40,55 455,95 455,225 40,265" fill="url(#gL)"/>
    <!-- RIGHT funnel: narrow at knot, widening outer-right -->
    <polygon points="1060,55 645,95 645,225 1060,265" fill="url(#gR)"/>

    <!-- knot circle -->
    <circle cx="550" cy="160" r="106" fill="#F5F5F7"/>
    <circle cx="550" cy="160" r="99" fill="#FFFFFF" stroke="#DDDFE3" stroke-width="1.5"/>
    <text x="550" y="156" text-anchor="middle" font-family="Lora,serif" font-size="19" font-weight="600" fill="#111111">KNOT</text>
    <text x="550" y="176" text-anchor="middle" font-family="Geist Mono,monospace" font-size="9" letter-spacing="1" fill="#6B7280">CLOSED-WON</text>

    <!-- edge labels (curved along funnel edges) -->
    <text font-family="Geist Mono,monospace" font-size="11" letter-spacing="1" font-weight="600" fill="#D95B28"><textPath href="#pLtop" startOffset="50%" text-anchor="middle">LEFT · ACQUIRE</textPath></text>
    <text font-family="Geist Mono,monospace" font-size="9.5" letter-spacing=".8" fill="#8a7566"><textPath href="#pLbot" startOffset="50%" text-anchor="middle">SALES · NUPUR · KSHITIJ · ASHISH</textPath></text>
    <text font-family="Geist Mono,monospace" font-size="11" letter-spacing="1" font-weight="600" fill="#3A7A65"><textPath href="#pRtop" startOffset="50%" text-anchor="middle">RIGHT · RETAIN &amp; GROW</textPath></text>
    <text font-family="Geist Mono,monospace" font-size="9.5" letter-spacing=".8" fill="#5a8577"><textPath href="#pRbot" startOffset="50%" text-anchor="middle">CS · NEEL + UNNATI</textPath></text>

    <!-- left stage chips -->
    <g font-family="Geist,sans-serif" font-size="12.5" fill="#111111" text-anchor="middle">
      <rect x="64" y="145" width="106" height="30" fill="#fff" stroke="#DDDFE3"/><text x="117" y="164">Outbound</text>
      <rect x="182" y="145" width="106" height="30" fill="#fff" stroke="#DDDFE3"/><text x="235" y="164">Inbound</text>
      <rect x="300" y="145" width="112" height="30" fill="#fff" stroke="#DDDFE3"/><text x="356" y="164">Partner-in</text>
    </g>
    <!-- right stage chips -->
    <g font-family="Geist,sans-serif" font-size="12" fill="#111111" text-anchor="middle">
      <rect x="660" y="145" width="86" height="30" fill="#fff" stroke="#DDDFE3"/><text x="703" y="164">Land</text>
      <rect x="756" y="145" width="86" height="30" fill="#fff" stroke="#DDDFE3"/><text x="799" y="164">Adopt</text>
      <rect x="852" y="145" width="88" height="30" fill="#fff" stroke="#DDDFE3"/><text x="896" y="164">Expand</text>
      <rect x="950" y="145" width="88" height="30" fill="#fff" stroke="#DDDFE3"/><text x="994" y="164">Renew</text>
    </g>
  </svg>
</div>
</div>
<div id="canvas">
  <div id="stage"><svg class="links" id="links"></svg></div>
  <div class="hint">Click a node to expand / collapse · scroll to zoom · drag the background to pan</div>
</div>

<script>
const ZONES=[
  {name:"Left — acquire",color:"#D95B28"},
  {name:"Knot — convert",color:"#B8860B"},
  {name:"Right — retain & grow (LEAR)",color:"#3A7A65"},
  {name:"Partners",color:"#334155"},
  {name:"The bets",color:"#2F7D8A"}

const L="#D95B28", K="#B8860B", R="#3A7A65", P="#334155", V="#2F7D8A";

const DATA={
  name:"Spectrum GTM Engine", root:true,
  children:[
    {name:"LEFT — acquire", note:"create & capture demand", color:L, region:true, children:[
      {name:"Three doors", c:true, children:[
        {name:"Outbound — we reach out first", children:[
          {name:"Dock Radar (signal-led, cross-vertical)"},
          {name:"Vertical ABM (thesis-led, per vertical)"},
          {name:"Terrain map (operators vs SIs · the anchor · GIS & common tools)"},
          {name:"Warm outbound = expansion (intros · CSX departments · global footprint)"}
        ]},
        {name:"Inbound — demand comes to us (web · search · content · events)"},
        {name:"Partner pipeline — tree/fruit partners bring us their deals"}
      ]},
      {name:"The sort — type × potential", note:"where focus lives", children:[
        {name:"What is it: SME · Enterprise · Partner"},
        {name:"How much potential"}
      ]},
      {name:"Three routes", c:true, children:[
        {name:"SME → deflect to a capable partner (feeds the partner)"},
        {name:"Enterprise → we own it (the flagships)"},
        {name:"Partner → into the enablement machine"}
      ]}
    ]},
    {name:"KNOT — convert", note:"qualified opportunity → won", color:K, region:true, children:[
      {name:"Conversion path", children:[
        {name:"Discovery"},
        {name:"Solutioning & demo"},
        {name:"Proposal & pricing"},
        {name:"Proof / POC / trial"},
        {name:"Negotiate & close"}
      ]},
      {name:"The docket — the vertical selling kit", note:"factory: a win → reusable material", children:[
        {name:"Use-case one-pagers (buyer's language)"},
        {name:"Anchor case studies with real numbers"},
        {name:"Demo · proposal · pricing"},
        {name:"Objections & who we displace"},
        {name:"First two: Mining & Ports"}
      ]},
      {name:"Two motions: direct (we run it) · partner co-sell (assist)"}
    ]},
    {name:"RIGHT — retain & grow", note:"LEAR · gates, not tracks · CS = Neel + Unnati", color:R, region:true, children:[
      {name:"Land — clean handoff", note:"Unnati (Neel support)", children:[
        {name:"Handoff: deal context · validate committed deliverables"},
        {name:"Success plan — their definition of success"},
        {name:"Stakeholder map (champion · economic buyer · blockers)"},
        {name:"Write down contract scope (guards against false expansion)"},
        {name:"Metric: won → onboarding-started · time-to-first-value"}
      ]},
      {name:"Adopt — the decisive stage & the sensor", note:"Unnati (Neel support)", children:[
        {name:"Onboarding → first flight → go-live (5 milestones, 30d)"},
        {name:"Health as the standing job (0-100 · exceptions only)"},
        {name:"Adoption + license/credit utilisation · NPS/CSAT"},
        {name:"Sensor: capture field intelligence", c:true, children:[
          {name:"→ Solution handbooks (per vertical)"},
          {name:"→ Enablement library + training (push what customers don't know we do)"},
          {name:"→ Product build priorities"},
          {name:"→ Feedback to the knot & outbound"}
        ]},
        {name:"Metric: feature adoption rate · health"}
      ]},
      {name:"Expand — where NRR is made", note:"Neel (Unnati support) · health-gated", c:true, children:[
        {name:"SQM principle: engineer expansion, don't wait for it"},
        {name:"Two gates: health + contract-execution ≠ expansion"},
        {name:"8 levers", children:[
          {name:"L1 more sites · L2 more use cases · L3 integrations/PS"},
          {name:"L4 new departments · L5 partner · L6 plan upgrade"},
          {name:"L7 APIs (per-call) · L8 AI links/credits"}
        ]},
        {name:"The 3-layer scan (per account)", note:"stack all three = engineer expansion", children:[
          {name:"L1 Quantitative — usage/plan-limit → Lever 6"},
          {name:"L2 Internal signal mining — email·calls·Slack·WA·tickets"},
          {name:"L3 External research — sites·departments·systems·peers"}
        ]},
        {name:"Score → judgment → tier", children:[
          {name:"Yes/Maybe/No per lever + evidence"},
          {name:"Judgment: champion strength·timing·comp risk·health"},
          {name:"Tier A ~$1M · B ~$500K · C ~$100-200K"}
        ]},
        {name:"Champion + exec sponsor (2nd champion = churn firewall)"},
        {name:"Tech workshops as the vehicle (HF Sinclair pattern)"},
        {name:"Reusable AI prompts (4): signal-mine · research · usage · sizing"},
        {name:"To-done: opp logged + drafted next step (proactive-touchpoint)"},
        {name:"Metric: expansion ARR / quarter · NRR"}
      ]},
      {name:"Renew — hold the floor", note:"Neel (Unnati support)", children:[
        {name:"90 / 60 / 30 tripwires (date internal, never broadcast)"},
        {name:"At-risk detection off the health engine → recovery plan"},
        {name:"Secure base first (PO · dates · terms)"},
        {name:"Value realisation — ROI narrative proves the renewal"},
        {name:"Upsell only if seeded a quarter out (seed→structured→pre-warm→confirm)"},
        {name:"Metric: renewal % · at-risk $ recovered"}
      ]}
    ]},
    {name:"PARTNERS — the parallel machine", note:"breadth & scale", color:P, region:true, children:[
      {name:"Tier: seed→sprout→tree→fruit (focus tree/fruit) · L1/L2"},
      {name:"Co-sell — assist closing their live deals", note:"tree/fruit first; don't babysit dormant"},
      {name:"Enablement — onboard the partner's team", note:"north star: deals closed without us on the call", c:true, children:[
        {name:"Like onboarding a partner's sales + product team"},
        {name:"Monthly recorded online sessions", children:[
          {name:"Use-case sessions"},
          {name:"Product / feature deep-dives"},
          {name:"Sales training (how to pitch & displace)"}
        ]},
        {name:"Partner handbooks + feature videos (from the sensor)"},
        {name:"Certification / readiness check"},
        {name:"Same engine → end users (TOFU + adoption)"},
        {name:"Everything flows into Ravi's partner cockpit"}
      ]},
      {name:"The loop: deflected SMEs → capable partners → the third door"}
    ]},
    {name:"THE BETS — Mining & Ports", note:"a bet = a thin slice through the whole engine, run as an experiment", color:V, region:true, children:[
      {name:"Same 5-part plan for both", note:"the repeatable playbook the next vertical inherits", c:true, children:[
        {name:"1 · Terrain & personas"},
        {name:"2 · Named lists (design partners)"},
        {name:"3 · Top-of-funnel (events + webinars)"},
        {name:"4 · The offer (wedge + docket)"},
        {name:"5 · Carve-out bar (proven?)"}
      ]},
      {name:"Mining (bet 1)", c:true, children:[
        {name:"1 · Terrain & personas", children:[
          {name:"Operators (in-house drone teams) vs SIs"},
          {name:"The anchor: the 'Terabase of mining' (Akara proof)"},
          {name:"SI persona → feeds outbound"},
          {name:"Common tools/systems (GIS)"}
        ]},
        {name:"2 · Named lists — work closely with", children:[
          {name:"Top end-users (priority): FQM · Anglo/Quellaveco · SQM"},
          {name:"Top partners/SIs: GoUAV · FS Systems · DC Geomatics"},
          {name:"Deep discovery → find pain points → product + docket"}
        ]},
        {name:"3 · Top-of-funnel", children:[
          {name:"EDR-of-mining events (per geography)", children:[
            {name:"Mining Indaba — Africa (Cape Town, Feb)"},
            {name:"Expomin — LATAM (Santiago, Chile)"},
            {name:"IMARC — Australia"},
            {name:"pre-ABM · booth · meetings off wedge · post-ABM"}
          ]},
          {name:"Use-case webinars / learning sessions (recurring TOFU)"},
          {name:"Use-case training that generates inbound"}
        ]},
        {name:"4 · The offer", children:[
          {name:"Wedge: security patrol · open-pit stockpile volumetrics"},
          {name:"Docket: one-pagers · anchor case study · objections"},
          {name:"Readiness gate: do we have a deliverable solution?"},
          {name:"open-pit ≠ shaft (ref is open-pit)"}
        ]},
        {name:"5 · Carve-out bar", note:"metric + go/no-go later", children:[
          {name:"flagships live · mature partners · docket · the event · written playbook"}
        ]}
      ]},
      {name:"Ports (bet 2)", c:true, children:[
        {name:"1 · Terrain & personas", children:[
          {name:"Operators vs SIs · automation is the wave"},
          {name:"The anchor: MPA/Skyports (Singapore)"},
          {name:"SI persona → feeds outbound"},
          {name:"Common tools/systems"}
        ]},
        {name:"2 · Named lists — work closely with", children:[
          {name:"Top end-users (priority): MPA/Skyports · TMA · Bintulu"},
          {name:"Top partners/SIs: Aerodyne · local operators"},
          {name:"Deep discovery → find pain points → product + docket"}
        ]},
        {name:"3 · Top-of-funnel", children:[
          {name:"EDR-of-ports events", children:[
            {name:"TOC Singapore — primary (MPA's turf, Nov)"},
            {name:"TOC Europe (May)"},
            {name:"Singapore Maritime Week (relationship event)"},
            {name:"pre-ABM · booth · meetings off wedge · post-ABM"}
          ]},
          {name:"Use-case webinars (ports) — TOFU"},
          {name:"Use-case training that generates inbound"}
        ]},
        {name:"4 · The offer", children:[
          {name:"Wedge: incident response · fairway · AIS · perimeter"},
          {name:"Docket: one-pagers · anchor case study · objections"},
          {name:"Readiness gate: deliverable solution? (ship AIS Flink / Cockpit)"},
          {name:"Mostly public buyers → RFI / tender cycles"}
        ]},
        {name:"5 · Carve-out bar", note:"metric + go/no-go later", children:[
          {name:"flagships live · mature partners · docket · the event · written playbook"}
        ]}
      ]},
      {name:"The content loop", note:"one engine, three uses", children:[
        {name:"webinars/training built here = partner enablement = adoption content"}
      ]}
    ]}
  ]
};

const NODE_W=250, COL_GAP=304, GAP=16, REGION_GAP=46, MX=40, MY=30;
const stage=document.getElementById('stage'), canvas=document.getElementById('canvas'), svg=document.getElementById('links');

function estH(node){
  const nameLines=Math.max(1,Math.ceil((node.name||'').length/30));
  const noteLines=node.note?Math.max(1,Math.ceil(node.note.length/38)):0;
  return 16+nameLines*16+noteLines*13;
}

(function init(node,parent){ node.parent=parent; node.color=node.root?"#1a1d23":(node.color||parent.color);
  (node.children||[]).forEach(c=>init(c,node)); })(DATA,null);

const legend=document.getElementById('legend');
ZONES.forEach(z=>{ const s=document.createElement('span'); s.innerHTML=`<span class="dot" style="background:${z.color}"></span>${z.name}`; legend.appendChild(s); });

function layout(){
  let cursor=MY; const visible=[];
  (function assign(node,depth){
    visible.push(node); node.x=MX+depth*COL_GAP;
    const kids=node._collapsed?[]:(node.children||[]);
    if(!kids.length){ const h=estH(node); node.y=cursor+h/2; cursor+=h+GAP; }
    else { kids.forEach((k,i)=>{ if(depth===0 && i>0) cursor+=REGION_GAP; assign(k,depth+1); }); node.y=(kids[0].y+kids[kids.length-1].y)/2; }
  })(DATA,0);
  return visible;
}

function render(){
  const visible=layout();
  let maxX=0,maxY=0; visible.forEach(n=>{ maxX=Math.max(maxX,n.x+NODE_W); maxY=Math.max(maxY,n.y); });
  const W=maxX+MX, H=maxY+MY;
  stage.style.width=W+'px'; stage.style.height=H+'px'; svg.setAttribute('width',W); svg.setAttribute('height',H);
  let paths='';
  visible.forEach(n=>{ if(!n.parent) return;
    const x1=n.parent.x+NODE_W, y1=n.parent.y, x2=n.x, y2=n.y, mx=(x1+x2)/2;
    paths+=`<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="${n.color}" stroke-opacity="0.55" stroke-width="1.4"/>`;
  });
  svg.innerHTML=paths;
  [...stage.querySelectorAll('.node')].forEach(e=>e.remove());
  visible.forEach(n=>{
    const d=document.createElement('div');
    d.className='node'+(n.root?' root':'')+(n.region?' region':'');
    d.style.left=n.x+'px'; d.style.top=n.y+'px'; d.style.transform='translateY(-50%)';
    if(!n.root) d.style.borderLeftColor=n.color;
    d.innerHTML=`<div class="name">${n.name}</div>`+(n.note?`<div class="note">${n.note}</div>`:'');
    if(n.children&&n.children.length&&n._collapsed){ const b=document.createElement('span'); b.className='badge'; b.textContent='+'+n.children.length; d.appendChild(b); }
    d.addEventListener('click',ev=>{ ev.stopPropagation(); if(n.children&&n.children.length){ n._collapsed=!n._collapsed; render(); } });
    stage.appendChild(d);
  });
}

function setDefaults(){ (function walk(n){ n._collapsed=!!n.c; (n.children||[]).forEach(walk); })(DATA); }
function setAll(v){ (function walk(n){ if(n.children&&n.children.length) n._collapsed=v; (n.children||[]).forEach(walk); })(DATA); }
function collapseRegions(){ (function walk(n,depth){ if(n.children&&n.children.length) n._collapsed = depth>=1; (n.children||[]).forEach(c=>walk(c,depth+1)); })(DATA,0); }

let scale=1, tx=24, ty=352;
function applyT(){ stage.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`; }
canvas.addEventListener('wheel',e=>{ e.preventDefault();
  const rect=canvas.getBoundingClientRect(), mx=e.clientX-rect.left, my=e.clientY-rect.top;
  const ns=Math.min(2.2,Math.max(0.25,scale*(1-e.deltaY*0.0015)));
  tx=mx-(mx-tx)*(ns/scale); ty=my-(my-ty)*(ns/scale); scale=ns; applyT();
},{passive:false});
let dragging=false,sx,sy;
canvas.addEventListener('mousedown',e=>{ if(e.target.closest('.node'))return; dragging=true; canvas.classList.add('dragging'); sx=e.clientX-tx; sy=e.clientY-ty; });
window.addEventListener('mousemove',e=>{ if(!dragging)return; tx=e.clientX-sx; ty=e.clientY-sy; applyT(); });
window.addEventListener('mouseup',()=>{ dragging=false; canvas.classList.remove('dragging'); });

document.getElementById('expandAll').onclick=()=>{ setAll(false); render(); };
document.getElementById('collapse').onclick=()=>{ collapseRegions(); render(); };
document.getElementById('reset').onclick=()=>{ setDefaults(); scale=1; tx=24; ty=352; applyT(); render(); };

setDefaults(); render(); applyT();
</script>
</body>
</html>
